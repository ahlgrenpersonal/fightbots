<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163e41"><title>Roman Bots Update</title><body style="background:#163e41;color:#eaf5e4;font:16px system-ui;padding:32px"><p>Updating Roman Bots…</p><script type="module">
