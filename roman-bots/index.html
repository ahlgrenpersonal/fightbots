<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#163e41">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Lead a little legion. A five-versus-five robot courtyard tactics game.">
  <title>Roman Bots</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css?v=roman14">
</head>
<body>
  <main id="game">
    <header class="topbar"><canvas id="brandMark" width="96" height="96" aria-hidden="true"></canvas><div class="brand"><b>ROMAN BOTS</b><span id="locationName">The Marble Courtyard</span></div><button id="info" class="icon-button" aria-label="Equipment details" title="Equipment details">ⓘ</button><button id="settings" class="icon-button" aria-label="Advanced settings" title="Advanced settings"></button><button id="pause" class="icon-button" aria-label="Pause" title="Pause" hidden>Ⅱ</button></header>
    <section id="builder" aria-label="Squad workshop">
      <div id="squadSlots" class="squad-slots" role="group" aria-label="Your five bots"></div>
      <div class="workbench"><canvas id="preview" width="720" height="420" aria-label="Selected bot"></canvas><div class="workbench-label"><b id="slotName">Captain</b><span id="handCount"></span></div></div>
      <section class="equipment-section"><h2>Weapon</h2><div id="weapons" class="weapon-grid" role="group" aria-label="Choose a weapon"></div></section>
      <section class="equipment-section shield-section"><h2>Shield</h2><div id="shields" class="shield-grid" role="group" aria-label="Choose a shield"></div></section>
      <p id="gearDescription" class="gear-description" hidden></p>
      <div class="builder-actions"><div class="opponent-heading"><b id="opponentName"></b></div><div class="opponent-row"><div id="opponentSquad" class="opponent-squad" aria-label="Opposing squad"></div><button id="nextOpponent" class="icon-button" aria-label="Next opponent" title="Next opponent"></button></div><button id="start" class="battle-button" aria-label="Start battle"><span>▶</span><b>Battle</b></button></div>
    </section>
    <section id="arena" aria-label="Courtyard battle" hidden><canvas id="battleCanvas" aria-label="Battlefield. Tap the ground to move or an enemy for the active soldier's power attack." tabindex="0"></canvas><div id="battleBanner" class="battle-banner" role="status" hidden></div><div id="targetHint" class="target-hint" hidden></div></section>
    <footer id="battleControls" class="battle-controls" hidden>
      <div class="squad-health"><div id="allyStatus" class="army-status" aria-label="Friendly squad"></div><div id="powerMeter" class="power-meter" role="group" aria-label="Active soldier"><canvas id="captainIcon" width="80" height="80" aria-hidden="true"></canvas><span id="powerStatus" role="status"></span></div><div id="enemyStatus" class="army-status enemy-status" aria-label="Opposing squad"></div></div>
    </footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialogTitle"><div id="dialogContent"></div></dialog>
  <audio id="music" src="assets/courtyard-theme.mp3" preload="auto" loop hidden></audio>
  <script type="module" src="app.js?v=roman14"></script>
</body>
</html>
